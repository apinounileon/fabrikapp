name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            build_cmd: uv run flet build linux
            artifact_path: build/linux
          - platform: windows
            os: windows-latest
            build_cmd: uv run flet build windows
            artifact_path: build/windows
          - platform: android
            os: ubuntu-latest
            build_cmd: uv run flet build apk
            artifact_path: build/app/outputs/flutter-apk/app-release.apk

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt update
          sudo apt install -y \
            binutils clang cmake gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 \
            gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-ugly \
            gstreamer1.0-pulseaudio gstreamer1.0-qt5 gstreamer1.0-tools \
            gstreamer1.0-x libasound2-dev libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev libgtk-3-dev \
            libmpv-dev libsecret-1-0 libsecret-1-dev libunwind-dev lld llvm mpv \
            ninja-build pkg-config

      - name: Install dependencies
        run: uv sync --group dev

      - name: Build ${{ matrix.platform }}
        run: ${{ matrix.build_cmd }}

      - uses: actions/upload-artifact@v4
        with:
          name: fabrikapp-${{ matrix.platform }}
          path: ${{ matrix.artifact_path }}
